<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Coming Soon - Car Wash. Something exciting is on the way.">
  <title>Coming Soon - Car Wash</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;420;460;500;520;540;580&family=Playfair+Display:wght@500;520;540;580&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>ðŸš—</text></svg>">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
      color: white;
      text-align: center;
      padding: var(--space-lg);
    }

    .coming-soon-container {
      max-width: 600px;
    }

    .coming-soon-logo {
      font-family: var(--font-heading);
      font-size: 3rem;
      font-weight: var(--weight-h1);
      margin-bottom: var(--space-md);
    }

    .coming-soon-title {
      font-size: 2.5rem;
      font-weight: var(--weight-h2);
      margin-bottom: var(--space-md);
    }

    .coming-soon-subtitle {
      font-size: var(--size-lead);
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: var(--space-xl);
      line-height: 1.6;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
    }

    .countdown-item {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: var(--space-lg);
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .countdown-number {
      font-size: 2.5rem;
      font-weight: var(--weight-h1);
      font-family: var(--font-heading);
      margin-bottom: var(--space-xs);
    }

    .countdown-label {
      font-size: var(--size-caption);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.8;
    }

    .newsletter-form {
      display: flex;
      gap: var(--space-sm);
      max-width: 400px;
      margin: 0 auto;
    }

    .newsletter-input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: var(--size-body);
    }

    .newsletter-input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.3);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: var(--space-md);
      margin-top: var(--space-xl);
    }

    .social-link {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      color: white;
      font-size: 1.5rem;
      transition: var(--transition);
    }

    .social-link:hover {
      background: var(--color-accent);
      color: var(--color-primary);
      transform: translateY(-4px);
    }

    @media (max-width: 768px) {
      .coming-soon-title {
        font-size: 2rem;
      }

      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      .countdown-number {
        font-size: 2rem;
      }

      .newsletter-form {
        flex-direction: column;
      }
    }

    @media (max-width: 360px) {
      .coming-soon-logo {
        font-size: 2rem;
      }

      .coming-soon-title {
        font-size: 1.5rem;
      }

      .countdown-item {
        padding: var(--space-md);
      }

      .countdown-number {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="coming-soon-container">
    <h1 class="coming-soon-logo"><img src="assets/images/logo.jpg" alt="Car Wash Logo" class="brand-icon"> Car Wash</h1>
    <h2 class="coming-soon-title">Something Amazing is Coming</h2>
    <p class="coming-soon-subtitle">We're working hard to bring you an enhanced car wash experience. Stay tuned for exciting updates and new features.</p>

    <div class="countdown">
      <div class="countdown-item">
        <div class="countdown-number" id="days">00</div>
        <div class="countdown-label">Days</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="hours">00</div>
        <div class="countdown-label">Hours</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="minutes">00</div>
        <div class="countdown-label">Minutes</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-number" id="seconds">00</div>
        <div class="countdown-label">Seconds</div>
      </div>
    </div>

    <p style="margin-bottom: var(--space-md);">Subscribe to be notified when we launch:</p>
    <form class="newsletter-form">
      <input type="email" placeholder="Enter your email" class="newsletter-input" required>
      <button type="submit" class="btn btn-accent">Notify Me</button>
    </form>

    <div class="social-links">
      <a href="#" class="social-link" aria-label="Facebook">
        <i class="ph ph-facebook-logo"></i>
      </a>
      <a href="#" class="social-link" aria-label="Instagram">
        <i class="ph ph-instagram-logo"></i>
      </a>
      <a href="#" class="social-link" aria-label="Twitter">
        <i class="ph ph-twitter-logo"></i>
      </a>
      <a href="#" class="social-link" aria-label="YouTube">
        <i class="ph ph-youtube-logo"></i>
      </a>
    </div>
  </div>

  <script>
    // Countdown Timer
    const countdownDate = new Date();
    countdownDate.setDate(countdownDate.getDate() + 30); // 30 days from now

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = countdownDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

      if (distance < 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
      }
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
  <!-- Back to Top Button -->
  <button id="backToTop" class="back-to-top" aria-label="Back to top">
    <i class="ph ph-arrow-up"></i>
  </button>
</body>
</html>
