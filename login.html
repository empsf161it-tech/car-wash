<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to your Car Wash account to access bookings, appointments, and exclusive offers.">
  <title>Login - Car Wash</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;420;460;500;520;540;580&family=Playfair+Display:wght@500;520;540;580&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="alternate icon" type="image/jpeg" href="assets/images/favicon.jpg">
  <link rel="apple-touch-icon" href="assets/images/favicon.jpg">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0f1c2e">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">

  <style>
    body {
      display: flex;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
      padding: 80px var(--space-md) var(--space-md);
    }

    [data-theme="dark"] body {
      background: #000000;
    }

    .login-container {
      margin: auto;
      width: 100%;
      max-width: 400px;
      padding: var(--space-2xl);
      background: var(--color-background);
      border-radius: var(--radius);
      box-shadow: var(--shadow-hover);
    }

    .auth-toggles .theme-toggle,
    .auth-toggles .rtl-toggle {
      color: white !important;
      background: rgba(255, 255, 255, 0.2);
    }

    .auth-toggles .theme-toggle:hover,
    .auth-toggles .rtl-toggle:hover {
      background: rgba(255, 255, 255, 0.3) !important;
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .login-logo {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: var(--weight-h1);
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .login-subtitle {
      color: var(--color-text-light);
      font-size: var(--size-body);
    }

    .social-login {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-lg);
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: 12px 16px;
      border: 2px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-background);
      color: var(--color-text);
      font-size: var(--size-body);
      font-weight: var(--weight-label);
      transition: var(--transition);
      cursor: pointer;
    }

    .social-btn:hover {
      border-color: var(--color-secondary);
      background: var(--color-surface);
    }

    .social-btn img {
      width: 20px;
      height: 20px;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: var(--space-lg) 0;
      color: var(--color-text-light);
      font-size: var(--size-caption);
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .divider span {
      padding: 0 var(--space-md);
    }

    .login-footer {
      text-align: center;
      margin-top: var(--space-lg);
      color: var(--color-text-light);
      font-size: var(--size-body);
    }

    .login-footer a {
      color: var(--color-secondary);
      font-weight: var(--weight-label);
    }

    .login-footer a:hover {
      color: var(--color-primary);
    }

    @media (max-width: 360px) {
      .login-container {
        padding: var(--space-lg);
      }
    }
  </style>
</head>
<body>
  <!-- Theme & RTL Toggles -->
  <div class="auth-toggles" style="position: absolute; top: var(--space-md); right: var(--space-md); display: flex; gap: var(--space-sm);">
    <button class="theme-toggle" aria-label="Toggle theme">
      <i class="ph ph-sun sun-icon"></i>
      <i class="ph ph-moon moon-icon" style="display: none;"></i>
    </button>
    <button class="rtl-toggle" aria-label="Toggle RTL">
      <i class="ph ph-arrows-left-right"></i>
    </button>
  </div>
  <div class="login-container">
    <div class="login-header">
      <h1 class="login-logo">
        <a href="index.html" style="text-decoration: none; color: inherit; display: inline-flex; align-items: center; justify-content: center;">
          <img src="assets/images/logo.jpg" alt="Car Wash Logo" class="brand-icon"> Car Wash
        </a>
      </h1>
      <p class="login-subtitle">Welcome back! Please login to your account.</p>
    </div>

    <form>
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" required>
        <div class="form-error">Please enter a valid email address</div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div style="position: relative;">
          <input type="password" id="password" name="password" class="form-input" required style="padding-right: 40px;">
          <i class="ph ph-eye toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--color-text-light); font-size: 20px;"></i>
        </div>
        <div class="form-error">Password must be at least 8 characters</div>
      </div>

      <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
        <label class="form-checkbox">
          <input type="checkbox" name="remember">
          <span style="font-size: var(--size-body); color: var(--color-text-light);">Remember me</span>
        </label>
        <a href="#" style="font-size: var(--size-body); color: var(--color-secondary);">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>

    <div class="divider">
      <span>or continue with</span>
    </div>

    <div class="social-login">
      <button type="button" class="social-btn">
        <img src="https://www.google.com/favicon.ico" alt="Google">
        Continue with Google
      </button>
      <button type="button" class="social-btn">
        <img src="https://www.apple.com/favicon.ico" alt="Apple">
        Continue with Apple
      </button>
    </div>

    <div class="login-footer">
      <p>Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="assets/js/main.js"></script>
  <!-- Back to Top Button -->
  <button id="backToTop" class="back-to-top" aria-label="Back to top">
    <i class="ph ph-arrow-up"></i>
  </button>
</body>
</html>
