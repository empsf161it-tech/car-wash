<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found - Car Wash">
  <title>404 - Page Not Found | Car Wash</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;420;460;500;520;540;580&family=Playfair+Display:wght@500;520;540;580&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>ðŸš—</text></svg>">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
      text-align: center;
    }

    .error-container {
      max-width: 600px;
      padding: var(--space-2xl);
      color: white;
    }

    .error-code {
      font-size: 8rem;
      font-weight: var(--weight-h1);
      font-family: var(--font-heading);
      line-height: 1;
      margin-bottom: var(--space-md);
      opacity: 0.9;
    }

    .error-title {
      font-size: 2rem;
      font-weight: var(--weight-h2);
      margin-bottom: var(--space-md);
      color: white;
    }

    .error-message {
      font-size: var(--size-lead);
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: var(--space-xl);
      line-height: 1.6;
    }

    .error-icon {
      font-size: 6rem;
      margin-bottom: var(--space-md);
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      .error-code {
        font-size: 5rem;
      }

      .error-title {
        font-size: 1.5rem;
      }

      .error-icon {
        font-size: 4rem;
      }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-icon">
      <i class="ph ph-car"></i>
    </div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">Oops! The page you're looking for seems to have taken a detour. Let's get you back on track.</p>
    <div class="flex-center" style="gap: var(--space-md);">
      <a href="index.html" class="btn btn-accent">Back to Home</a>
      <a href="services.html" class="btn btn-outline" style="border-color: white; color: white;">View Services</a>
    </div>
  </div>
  <!-- Back to Top Button -->
  <button id="backToTop" class="back-to-top" aria-label="Back to top">
    <i class="ph ph-arrow-up"></i>
  </button>
</body>
</html>
