<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Car Wash account to book appointments, track orders, and access exclusive offers.">
  <title>Register - Car Wash</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;420;460;500;520;540;580&family=Playfair+Display:wght@500;520;540;580&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
    }

    .register-container {
      width: 100%;
      max-width: 400px;
      padding: var(--space-2xl);
      background: var(--color-background);
      border-radius: var(--radius);
      box-shadow: var(--shadow-hover);
    }

    .register-header {
      text-align: center;
      margin-bottom: var(--space-xl);
    }

    .register-logo {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: var(--weight-h1);
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .register-subtitle {
      color: var(--color-text-light);
      font-size: var(--size-body);
    }

    .social-login {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-lg);
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: 12px 16px;
      border: 2px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-background);
      color: var(--color-text);
      font-size: var(--size-body);
      font-weight: var(--weight-label);
      transition: var(--transition);
      cursor: pointer;
    }

    .social-btn:hover {
      border-color: var(--color-secondary);
      background: var(--color-surface);
    }

    .social-btn img {
      width: 20px;
      height: 20px;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: var(--space-lg) 0;
      color: var(--color-text-light);
      font-size: var(--size-caption);
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .divider span {
      padding: 0 var(--space-md);
    }

    .register-footer {
      text-align: center;
      margin-top: var(--space-lg);
      color: var(--color-text-light);
      font-size: var(--size-body);
    }

    .register-footer a {
      color: var(--color-secondary);
      font-weight: var(--weight-label);
    }

    .register-footer a:hover {
      color: var(--color-primary);
    }

    @media (max-width: 360px) {
      .register-container {
        padding: var(--space-lg);
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-header">
      <h1 class="register-logo">Car Wash</h1>
      <p class="register-subtitle">Create your account to get started</p>
    </div>

    <form>
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" name="name" class="form-input" required>
        <div class="form-error">Please enter your full name</div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" required>
        <div class="form-error">Please enter a valid email address</div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" required>
        <div class="form-error">Password must be at least 8 characters</div>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required>
        <div class="form-error">Passwords do not match</div>
      </div>

      <div class="form-group">
        <label class="form-checkbox">
          <input type="checkbox" name="terms" required>
          <span style="font-size: var(--size-body); color: var(--color-text-light);">I accept the <a href="#" style="color: var(--color-secondary);">Terms & Conditions</a> and <a href="#" style="color: var(--color-secondary);">Privacy Policy</a></span>
        </label>
        <div class="form-error">You must accept the terms and conditions</div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
    </form>

    <div class="divider">
      <span>or continue with</span>
    </div>

    <div class="social-login">
      <button type="button" class="social-btn">
        <img src="https://www.google.com/favicon.ico" alt="Google">
        Continue with Google
      </button>
      <button type="button" class="social-btn">
        <img src="https://www.apple.com/favicon.ico" alt="Apple">
        Continue with Apple
      </button>
    </div>

    <div class="register-footer">
      <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="assets/js/main.js"></script>
</body>
</html>
